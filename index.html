<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;600&family=Sofia+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app">

    <header class="app-header">
      <h1>Quests</h1>
      <p class="status" id="status"></p>
    </header>

    <form class="add-form" id="add-form">
      <label for="new-task" class="visually-hidden">New Task</label>
      <input type="text" id="new-task" placeholder="What needs to be done?" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <ul class="task-list" id="task-list">
    </ul>

  </main>

</body>
</html>
